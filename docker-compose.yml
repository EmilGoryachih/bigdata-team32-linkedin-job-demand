services:
  postgres:
    image: postgres:16
    container_name: linkedin_bigdata_postgres
    environment:
      POSTGRES_DB: linkedin_jobs
      POSTGRES_USER: team32
      POSTGRES_PASSWORD: team32
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./:/workspace
    command: >
      postgres
      -c max_wal_size=4GB
      -c shared_buffers=512MB
      -c maintenance_work_mem=512MB

volumes:
  postgres_data: